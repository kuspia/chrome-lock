<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Locked</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 15px system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  form { display: flex; flex-direction: column; gap: 10px; width: 340px; text-align: center; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  p { margin: 0 0 6px; color: #999; font-size: 13px; }

  /* GET OUT! shakes and flares brighter red each time the shoe lands (same 1.6s loop as the kick) */
  .getout { font-size: 44px; font-weight: 900; letter-spacing: 3px; color: #e5392f; text-shadow: 0 2px 0 #7a1410; margin: 0 0 4px;
            animation: getout 1.6s linear infinite; }
  @keyframes getout {
    0%, 67% { transform: none; color: #e5392f; text-shadow: 0 2px 0 #7a1410; }
    70%     { transform: translate(-7px, 2px) rotate(-4deg) scale(1.14); color: #ff1206; text-shadow: 0 2px 0 #7a1410, 0 0 22px #ff2a1a, 0 0 6px #ff6a5a; }
    73%     { transform: translate(7px, -2px) rotate(4deg) scale(1.14); color: #ff1206; text-shadow: 0 2px 0 #7a1410, 0 0 22px #ff2a1a, 0 0 6px #ff6a5a; }
    76%     { transform: translate(-6px, 1px) rotate(-3deg) scale(1.1); color: #ff1206; text-shadow: 0 2px 0 #7a1410, 0 0 18px #ff2a1a; }
    79%     { transform: translate(5px, -1px) rotate(2.5deg) scale(1.08); color: #ff1c10; text-shadow: 0 2px 0 #7a1410, 0 0 14px #ff2a1a; }
    83%     { transform: translate(-3px, 1px) rotate(-1.5deg) scale(1.05); color: #f8261a; text-shadow: 0 2px 0 #7a1410, 0 0 10px #ff2a1a; }
    87%     { transform: translate(2px, 0) rotate(1deg) scale(1.02); color: #f02e23; text-shadow: 0 2px 0 #7a1410, 0 0 6px #ff2a1a; }
    93%, 100% { transform: none; color: #e5392f; text-shadow: 0 2px 0 #7a1410; }
  }

  /* Kick animation */
  .kick { width: 340px; height: 193px; margin: 0 auto 6px; overflow: visible; }
  .kick .leg   { transform-origin: 77px -60px; animation: kick 1.6s ease-in-out infinite; }
  .kick .burst { transform-box: fill-box; transform-origin: center; animation: burst 1.6s ease-out infinite; }
  .kick .lines { animation: lines 1.6s linear infinite; }
  .kick .bum   { transform-box: fill-box; transform-origin: 60% 45%; animation: bum 1.6s ease-out infinite; }
  .kick .soft  { transform-box: fill-box; transform-origin: 75% 50%; animation: jiggle 1.6s linear infinite; }
  .kick .red   { opacity: 0; animation: red 1.6s ease-out infinite; }
  .kick .rip   { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ripple 1.6s ease-out infinite; }
  .kick .rip.b { animation-delay: 0.1s; }
  .kick .rip.c { animation-delay: 0.2s; }
  @keyframes kick { 0%,100% { transform: rotate(8deg); } 55% { transform: rotate(22deg); } 68% { transform: rotate(-28deg); } 80% { transform: rotate(-22deg); } }
  @keyframes burst { 0%,64% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 85% { transform: scale(1); opacity: .9; } 100% { transform: scale(.4); opacity: 0; } }
  @keyframes lines { 0%,62% { opacity: 0; } 70% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes bum { 0%,66% { transform: none; } 72% { transform: translate(14px,-8px) rotate(5deg); } 86% { transform: translate(5px,-2px) rotate(1.5deg); } 100% { transform: none; } }
  @keyframes jiggle { 0%,68% { transform: none; } 71% { transform: scale(.88,1.07); } 75% { transform: scale(1.06,.95); } 79% { transform: scale(.96,1.035); } 83% { transform: scale(1.025,.985); } 87% { transform: scale(.99,1.01); } 91%,100% { transform: none; } }
  @keyframes red { 0%,68% { opacity: 0; } 73% { opacity: .8; } 92% { opacity: .65; } 100% { opacity: 0; } }
  @keyframes ripple { 0%,68% { transform: scale(.1); opacity: 0; } 70% { transform: scale(.2); opacity: .7; } 90%,100% { transform: scale(3.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .getout, .kick .leg, .kick .burst, .kick .lines, .kick .bum, .kick .soft, .kick .red, .kick .rip { animation: none; }
  }

  /* Invisible but still focusable, so the keyboard goes to it. */
  input { position: absolute; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0;
          opacity: 0; caret-color: transparent; background: transparent; color: transparent; outline: none; }
</style>
</head>
<body>

    <filter id="fd1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="fl1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="fc1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.7"/></filter>
    <linearGradient id="fg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".18" stop-color="#fff"/><stop offset=".84" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="fm1" maskUnits="userSpaceOnUse" x="200" y="-42" width="190" height="170"><rect x="200" y="-42" width="190" height="170" fill="url(#fg1)"/></mask>
  </defs>
  <g transform="translate(19 0)">
  <g class="bum" mask="url(#fm1)">
    <g class="soft">
      <path d="M262 -40 C258 -24 250 -8 240 4 C226 16 216 32 218 50 C220 66 230 78 244 84 C248 96 250 110 252 126 L330 126 C332 108 334 92 334 78 C338 56 336 30 330 6 C326 -10 322 -26 322 -40 Z" fill="url(#bx1)"/>
      <g clip-path="url(#cp1)">
        <path d="M262 -40 C258 -24 250 -8 240 4 C226 16 216 32 218 50 C220 66 230 78 244 84 C248 96 250 110 252 126 L330 126 C332 108 334 92 334 78 C338 56 336 30 330 6 C326 -10 322 -26 322 -40 Z" fill="url(#by1)"/>
        <!-- soft shadows -->
        <g filter="url(#fd1)" fill="none" stroke-linecap="round">
          <circle cx="238" cy="44" r="22" fill="url(#sd1_0)"/><circle cx="274" cy="50" r="40" fill="url(#sd1_1)"/>
          <path d="M259 6 C243 18 229 36 231 52 C233 68 241 80 253 86" stroke="#7a4630" stroke-width="10" opacity="0.7"/><path d="M254 89 C270 97 292 95 308 83" stroke="#7a4630" stroke-width="9" opacity="0.75"/><path d="M228 82 C236 88 246 89 254 88" stroke="#7a4630" stroke-width="7" opacity="0.6"/><path d="M256 90 C256 102 257 114 258 128" stroke="#7a4630" stroke-width="7" opacity="0.85"/><path d="M280 -40 C278 -24 272 -8 263 4" stroke="#7a4630" stroke-width="7" opacity="0.35"/><path d="M312 8 C322 28 322 54 314 76" stroke="#7a4630" stroke-width="14" opacity="0.35"/><path d="M332 20 C338 44 336 64 334 80" stroke="#7a4630" stroke-width="12" opacity="0.3"/>
          <ellipse cx="256" cy="-8" rx="4" ry="5" fill="#7a4630" opacity=".4"/><ellipse cx="288" cy="-6" rx="4" ry="5" fill="#7a4630" opacity=".4"/>
        </g>
        <!-- warm blush + soft light on the round of each cheek -->
        <circle cx="238" cy="44" r="22" fill="url(#sb1_0)"/><circle cx="238" cy="44" r="23.1" fill="url(#sl1_0)"/><circle cx="274" cy="50" r="40" fill="url(#sb1_1)"/><circle cx="274" cy="50" r="42" fill="url(#sl1_1)"/>
        <g filter="url(#fl1)" fill="none" stroke-linecap="round">
          <path d="M224 34 C228 22 236 10 246 2" stroke="#ffe6d6" stroke-width="6" opacity="0.4"/><path d="M268 12 C253 22 241 38 242 52" stroke="#ffe6d6" stroke-width="5" opacity="0.3"/>
        </g>
        <!-- creases -->
        <g filter="url(#fc1)" fill="none" stroke="#7a4630" stroke-width="1.5" stroke-linecap="round" opacity=".75">
          <path d="M262 8 C247 19 233 37 235 52 C237 67 245 79 256 86"/><path d="M256 86 C270 94 292 92 307 80"/><path d="M229 80 C237 86 246 87 254 86"/>
        </g>
        <!-- hit: goes red, ripples spread -->
        <circle class="red" cx="230" cy="50" r="38" fill="url(#rd1)"/>
        <g fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2">
          <circle class="rip" cx="222" cy="50" r="14"/><circle class="rip b" cx="222" cy="50" r="14"/><circle class="rip c" cx="222" cy="50" r="14"/>
        </g>
      </g>
    </g>
  </g></g>
    </g>

    <rect x="60" y="-60" width="34" height="120" rx="8" fill="#3b4a6b"/>

    <g stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="104" y1="80" x2="96" y2="94"/><line x1="116" y1="82" x2="108" y2="97"/><line x1="128" y1="86" x2="120" y2="100"/></g>
    <rect x="52" y="116" width="124" height="16" rx="8" fill="#e8e8e8"/><rect x="52" y="126" width="124" height="6" rx="3" fill="#bbb"/></g>
    <g transform="translate(38 -56)"><g class="burst" fill="#f5c542"><path d="M196 96 l6 -16 l4 15 l14 -6 l-9 12 l12 8 l-15 0 l2 15 l-10 -11 l-9 11 l1 -15 l-14 -1 l12 -8 l-8 -12 l13 6 z"/></g></g>
  </svg>
  <h1>My browser. Don't open it.</h1>
  <p>Use <b>Chrome Guest</b> from the taskbar below.</p>
  <input id="pw" type="password" autofocus aria-hidden="true">
</form>
<script src="lock.js"></script>
</body>
</html>

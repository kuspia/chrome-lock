<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Locked</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 15px system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  form { display: flex; flex-direction: column; gap: 10px; width: 300px; text-align: center; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  p { margin: 0 0 6px; color: #999; font-size: 13px; }
  /* Kicking shoe */
  .kick { width: 296px; height: 184px; margin: 0 auto 6px; overflow: visible; }
  .kick .bum { transform-origin: 277px 98px; animation: bum 1.6s ease-out infinite; }
  /* jiggle */
  .kick .cheek-l { transform-origin: 270px 44px; animation: jiggle 1.6s linear infinite; }
  @keyframes jiggle {
    0%, 68% { transform: scale(1, 1); }
    71%     { transform: scale(0.8, 1.12); }
    75%     { transform: scale(1.1, 0.92); }
    79%     { transform: scale(0.94, 1.05); }
    83%     { transform: scale(1.03, 0.98); }
    88%, 100% { transform: scale(1, 1); }
  }
  /* turns red where it got kicked */
  .kick .red { opacity: 0; animation: red 1.6s ease-out infinite; }
  @keyframes red  { 0%, 68% { opacity: 0; } 72% { opacity: 0.9; } 92% { opacity: 0.75; } 100% { opacity: 0; } }
  /* ripples */
  .kick .ripple { transform-origin: 244px 46px; opacity: 0; animation: ripple 1.6s ease-out infinite; }
  .kick .r2 { animation-delay: 0.1s; }
  .kick .r3 { animation-delay: 0.2s; }
  @keyframes ripple {
    0%, 68% { transform: scale(0.1); opacity: 0; }
    70%     { transform: scale(0.2); opacity: 1; }
    90%     { transform: scale(3.2); opacity: 0; }
    100%    { transform: scale(3.2); opacity: 0; }
  }
  @keyframes bum {
    0%, 66%  { transform: translate(0, 0) rotate(0); }
    72%      { transform: translate(16px, -12px) rotate(9deg); }   /* OOF */
    86%      { transform: translate(6px, -3px) rotate(3deg); }
    100%     { transform: translate(0, 0) rotate(0); }
  }
  .kick .leg { transform-origin: 77px -60px; animation: kick 1.6s ease-in-out infinite; }
  .kick .burst { transform-origin: 200px 104px; animation: burst 1.6s ease-out infinite; }
  .kick .lines { animation: lines 1.6s linear infinite; }
  @keyframes kick {
    0%, 100% { transform: rotate(8deg); }
    55%      { transform: rotate(22deg); }   /* wind up */
    68%      { transform: rotate(-28deg); }  /* KICK */
    80%      { transform: rotate(-22deg); }
  }
  @keyframes burst {
    0%, 64%  { transform: scale(0); opacity: 0; }
    70%      { transform: scale(1.15); opacity: 1; }
    85%      { transform: scale(1); opacity: 0.9; }
    100%     { transform: scale(0.4); opacity: 0; }
  }
  @keyframes lines {
    0%, 62% { opacity: 0; }
    70%     { opacity: 1; }
    100%    { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .kick .leg, .kick .burst, .kick .lines, .kick .bum,
    .kick .cheek-l, .kick .red, .kick .ripple { animation: none; }
  }

  /* Invisible but still focusable, so the keyboard goes to it. */
  input { position: absolute; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0;
          opacity: 0; caret-color: transparent; background: transparent; color: transparent; outline: none; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <svg class="kick" viewBox="0 -70 370 230" aria-hidden="true">
    <!-- speed lines along the kick's swing -->
    <g class="lines" stroke="#777" stroke-width="5" stroke-linecap="round">
      <line x1="138" y1="128" x2="168" y2="112"/>
      <line x1="150" y1="146" x2="190" y2="122"/>
      <line x1="170" y1="156" x2="202" y2="134"/>
    </g>
    <!-- leg + shoe, swings from the hip -->
    <g class="leg">
      <rect x="60" y="-60" width="34" height="120" rx="8" fill="#3b4a6b"/>
      <path d="M58 118 L58 62 Q58 52 68 52 L94 52 L104 72 Q132 74 152 88 Q172 97 172 112 L172 118 Z" fill="#d6453b"/>
      <path d="M68 52 L94 52 L97 60 L66 60 Z" fill="#a8322a"/>
      <g stroke="#fff" stroke-width="3" stroke-linecap="round">
        <line x1="104" y1="80" x2="96" y2="94"/>
        <line x1="116" y1="82" x2="108" y2="97"/>
        <line x1="128" y1="86" x2="120" y2="100"/>
      </g>
      <rect x="52" y="116" width="124" height="16" rx="8" fill="#e8e8e8"/>
      <rect x="52" y="126" width="124" height="6" rx="3" fill="#bbb"/>
    </g>
    <!-- the bum getting kicked (side view, jeans, bulging toward the shoe) -->
    <defs>
      <clipPath id="cheeks">
        <path d="M266 8 C254 14 240 30 242 48 C243 64 254 76 270 76 L296 76 C303 60 303 24 297 8 Z"/>
      </clipPath>
    </defs>
    <g transform="translate(246 46) scale(1.4) translate(-246 -46)">
    <g class="bum">
      <g class="cheek-l">
        <path d="M266 8 C254 14 240 30 242 48 C243 64 254 76 270 76 L296 76 C303 60 303 24 297 8 Z" fill="#4a6fa5"/>
        <path class="red" d="M266 8 C254 14 240 30 242 48 C243 64 254 76 270 76 L296 76 C303 60 303 24 297 8 Z" fill="#e0302a"/>
        <!-- back pocket -->
        <path d="M249 28 L263 25 L265 41 L258 46 L251 43 Z" fill="none" stroke="#2f4a73" stroke-width="2" stroke-linejoin="round"/>
        <!-- crease under the cheek -->
        <path d="M257 70 Q272 74 290 68" fill="none" stroke="#2f4a73" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <!-- ripples spreading over the bum from where the shoe hits -->
      <g clip-path="url(#cheeks)" fill="none" stroke="#ffd2cc" stroke-width="2.5">
        <circle class="ripple" cx="244" cy="46" r="14"/>
        <circle class="ripple r2" cx="244" cy="46" r="14"/>
        <circle class="ripple r3" cx="244" cy="46" r="14"/>
      </g>
      <!-- waistband + belt loop -->
      <path d="M264 3 L299 3 L299 13 L262 13 Q262 7 264 3 Z" fill="#2f4a73"/>
      <rect x="276" y="2" width="5" height="12" rx="1.5" fill="#24395a"/>
    </g>
    </g>
    <!-- impact burst where the toe lands at full kick -->
    <g transform="translate(38 -56)">
      <g class="burst" fill="#f5c542">
        <path d="M196 96 l6 -16 l4 15 l14 -6 l-9 12 l12 8 l-15 0 l2 15 l-10 -11 l-9 11 l1 -15 l-14 -1 l12 -8 l-8 -12 l13 6 z"/>
      </g>
    </g>
  </svg>
  <h1>My browser. Don't open it.</h1>
  <p>Use <b>Chrome Guest</b> from the taskbar below.</p>
  <input id="pw" type="password" autofocus aria-hidden="true">
</form>
<script src="lock.js"></script>
</body>
</html>
